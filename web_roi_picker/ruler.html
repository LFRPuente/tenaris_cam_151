<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Comparador cam151 / cam152 — Día 22</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#050a0f;color:#d4e4f0;font-family:"Space Grotesk",system-ui,sans-serif;font-size:13px;display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ── Toolbar ── */
.toolbar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#0b1520;border-bottom:1px solid rgba(100,160,200,.18);flex-shrink:0;flex-wrap:wrap}
.toolbar h1{font-size:12px;font-weight:700;letter-spacing:.08em;color:#90cef4;white-space:nowrap}
.chip{background:#0f2030;border:1px solid rgba(100,160,200,.2);border-radius:5px;padding:2px 8px;font-size:11px;color:#7baac4}
.chip span{color:#ffd060;font-weight:600}
.sep{width:1px;height:18px;background:rgba(100,160,200,.15);flex-shrink:0}
button{background:#1a3a5c;border:1px solid rgba(100,180,255,.3);color:#90cef4;border-radius:6px;padding:4px 11px;cursor:pointer;font-size:11px;white-space:nowrap}
button:hover{background:#1f4a78}
button.danger{background:#2a1020;border-color:rgba(255,80,80,.3);color:#f08080}
button.danger:hover{background:#3a1828}

/* ── Main layout ── */
.main{flex:1;min-height:0;display:flex;gap:0}

/* ── Canvas panels ── */
.panel{display:flex;flex-direction:column;flex:1;min-width:0;border-right:1px solid rgba(100,160,200,.1)}
.panel-header{padding:4px 9px;background:#080f18;border-bottom:1px solid rgba(100,160,200,.1);display:flex;align-items:center;gap:7px;flex-shrink:0}
.cam-label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.panel.cam151 .cam-label{color:#65d9ff}
.panel.cam152 .cam-label{color:#ff8bc4}
.panel-header .chip{font-size:10px}
.canvas-wrap{flex:1;min-height:0;position:relative;overflow:hidden;cursor:crosshair;background:#020508}
.canvas-wrap canvas{position:absolute;top:0;left:0;pointer-events:none}
.canvas-wrap canvas.interactive{pointer-events:auto}

/* ── Sidebar ── */
.sidebar{width:300px;flex-shrink:0;background:#080f18;display:flex;flex-direction:column;overflow:hidden}
.sidebar-title{padding:7px 11px 5px;font-size:10px;color:#7baac4;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid rgba(100,160,200,.1);flex-shrink:0}
.tube-table{flex:1;overflow-y:auto}

table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;z-index:1;background:#080f18;padding:5px 8px;font-size:10px;color:#5a8aaa;text-align:right;border-bottom:1px solid rgba(100,160,200,.12);white-space:nowrap}
thead th:nth-child(1){text-align:center;width:30px}
thead th:nth-child(2){text-align:left}
thead th.h151{color:#65d9ff}
thead th.h152{color:#ff8bc4}
thead th.hdiff{color:#90d890}
tbody tr{border-bottom:1px solid rgba(100,160,200,.04);cursor:pointer}
tbody tr:hover{background:rgba(100,160,200,.04)}
tbody tr.active{background:rgba(77,180,255,.12)!important}
td{padding:4px 8px;vertical-align:middle}
.td-i{text-align:center;color:#3a6a8a;font-size:10px;width:30px}
.td-n{min-width:70px}
.name-disp{color:#d4e4f0;font-size:11px;cursor:text}
.name-disp:hover{text-decoration:underline dotted rgba(100,160,200,.4)}
.name-inp{background:#0f1e2d;border:1px solid rgba(100,160,200,.3);color:#d4e4f0;border-radius:3px;padding:1px 5px;font-size:11px;width:100%;outline:none}
.td-d{text-align:right;font-variant-numeric:tabular-nums;font-size:11px;white-space:nowrap;min-width:62px}
.td-d.v151{color:#65d9ff}
.td-d.v152{color:#ff8bc4}
.td-d.vdiff{color:#90d890}
.td-d.empty{color:#2a4a5a}
/* manual override: italic */
.td-d.ov{font-style:italic;opacity:.92}

.sidebar-btns{padding:7px 10px;border-top:1px solid rgba(100,160,200,.1);display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
.sidebar-btns button{flex:1;font-size:10px;padding:3px 7px}

/* ── Status ── */
#status{padding:3px 12px;font-size:10px;color:#3a6a5a;background:#050a0f;border-top:1px solid rgba(100,160,200,.07);flex-shrink:0;min-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:#030810}::-webkit-scrollbar-thumb{background:#1a3a5c;border-radius:3px}
</style>
</head>
<body>

<div class="toolbar">
  <h1>CAM 151 / 152 — DÍA 22</h1>
  <div class="sep"></div>
  <div class="chip" id="chip151">151: <span>—</span></div>
  <div class="chip" id="chip152">152: <span>—</span></div>
  <div class="chip" id="chipPpi">ppi 151: <span id="ppi151val">—</span> · 152: <span id="ppi152val">—</span></div>
  <div style="flex:1"></div>
  <button id="exportBtn">⬇ CSV</button>
</div>

<div class="main">

  <!-- CAM 151 -->
  <div class="panel cam151">
    <div class="panel-header">
      <span class="cam-label">CAM 151</span>
      <span class="chip" id="info151">—</span>
      <span style="font-size:10px;color:#4a7a9a;margin-left:auto">scroll=zoom · drag derecho=pan · click=medir</span>
    </div>
    <div class="canvas-wrap" id="wrap151">
      <canvas id="img151"></canvas>
      <canvas id="ov151" class="interactive"></canvas>
    </div>
  </div>

  <!-- CAM 152 -->
  <div class="panel cam152">
    <div class="panel-header">
      <span class="cam-label">CAM 152</span>
      <span class="chip" id="info152">—</span>
      <span style="font-size:10px;color:#4a7a9a;margin-left:auto">scroll=zoom · drag derecho=pan · click=medir</span>
    </div>
    <div class="canvas-wrap" id="wrap152">
      <canvas id="img152"></canvas>
      <canvas id="ov152" class="interactive"></canvas>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-title">Tubos — Mediciones</div>
    <div class="tube-table">
      <table>
        <thead><tr>
          <th>#</th><th style="text-align:left">Nombre</th>
          <th class="h151">151 (in)</th>
          <th class="h152">152 (in)</th>
          <th class="hdiff">Δ</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="sidebar-btns">
      <button id="resetBtn" title="Borra todas las mediciones manuales en ambas cámaras">↺ Reset overrides</button>
      <button id="exportBtn2">⬇ CSV</button>
    </div>
  </div>

</div>
<div id="status">Cargando datos…</div>

<script>
// ────────────────────────────────────────────────────────────────────────────
// State per camera side
// ────────────────────────────────────────────────────────────────────────────
const CAM = {
  151: {
    wrapId:"wrap151", imgId:"img151", ovId:"ov151",
    warpUrl:"/artifacts/web_homography_preview/cam_151_202604022/tube_detection_warp.jpg",
    jsonUrl:"/artifacts/tube_matcher_inputs/cam151_tube_measurements_latest.json",
    color:"#65d9ff",
    img:null, data:null, pxPerIn:null,
    // view
    zoom:1, ox:0, oy:0, drag:null,
  },
  152: {
    wrapId:"wrap152", imgId:"img152", ovId:"ov152",
    warpUrl:"/artifacts/web_homography_preview/cam_152_202604022/tube_detection_warp.jpg",
    jsonUrl:"/artifacts/tube_matcher_inputs/cam152_tube_measurements_latest.json",
    color:"#ff8bc4",
    img:null, data:null, pxPerIn:null,
    zoom:1, ox:0, oy:0, drag:null,
  },
};

// rows: [{idx, name, d151, d152, ov151, ov152, refX151, refX152}]
// d* = pre-computed distance_in from JSON
// ov* = manual override distance_in (null = not overridden)
// refX* = ref_x from JSON (warp px, nearly constant)
let rows = [];
let activeIdx = null;   // row index

const statusEl = document.getElementById("status");
function setStatus(m){ statusEl.textContent = m; }

// ────────────────────────────────────────────────────────────────────────────
// Load
// ────────────────────────────────────────────────────────────────────────────
async function init(){
  const [d151, d152, img151, img152] = await Promise.all([
    fetch(CAM[151].jsonUrl).then(r=>{ if(!r.ok) throw new Error("151 json "+r.status); return r.json(); }),
    fetch(CAM[152].jsonUrl).then(r=>{ if(!r.ok) throw new Error("152 json "+r.status); return r.json(); }),
    loadImage(CAM[151].warpUrl),
    loadImage(CAM[152].warpUrl),
  ]);

  CAM[151].data = d151; CAM[151].img = img151;
  CAM[152].data = d152; CAM[152].img = img152;

  // derive px_per_in from JSON items (offset_px / distance_in, median)
  CAM[151].pxPerIn = medianPpi(d151.items);
  CAM[152].pxPerIn = medianPpi(d152.items);

  document.getElementById("chip151").innerHTML = `151: <span>${d151.items.length} tubos</span>`;
  document.getElementById("chip152").innerHTML = `152: <span>${d152.items.length} tubos</span>`;
  document.getElementById("ppi151val").textContent = CAM[151].pxPerIn.toFixed(3);
  document.getElementById("ppi152val").textContent = CAM[152].pxPerIn.toFixed(3);

  buildRows();

  [151,152].forEach(k=>{
    resize(k);
    fit(k);
    setupInteraction(k);
  });
  renderTable();
  redrawBoth();

  setStatus(`Listo. Click en el warp para medir un tubo (distancia horizontal desde ese punto a la línea de referencia).`);
}

function loadImage(url){
  return new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url+"?_="+Date.now(); });
}

function medianPpi(items){
  const vals = items
    .filter(t => t.source_measurement.distance_in > 0.5)
    .map(t => t.source_measurement.offset_px / t.source_measurement.distance_in);
  vals.sort((a,b)=>a-b);
  const m = Math.floor(vals.length/2);
  return vals.length % 2 === 0 ? (vals[m-1]+vals[m])/2 : vals[m];
}

// ────────────────────────────────────────────────────────────────────────────
// Rows
// ────────────────────────────────────────────────────────────────────────────
function buildRows(){
  const n = Math.max(CAM[151].data.items.length, CAM[152].data.items.length);
  rows = [];
  for(let i=0;i<n;i++){
    const t151 = CAM[151].data.items[i];
    const t152 = CAM[152].data.items[i];
    rows.push({
      idx: i,
      name: t151?.display_name ?? t152?.display_name ?? `Tubo ${i+1}`,
      d151: t151?.distance_in ?? null,
      d152: t152?.distance_in ?? null,
      ov151: null,   // manual override
      ov152: null,
      // ref_x per tube from JSON (warp space)
      refX151: t151?.source_measurement?.ref_x ?? null,
      refX152: t152?.source_measurement?.ref_x ?? null,
      // x_start_warp per tube from JSON (for overlay dot)
      xs151: t151?.source_measurement?.x_start_warp ?? null,
      xs152: t152?.source_measurement?.x_start_warp ?? null,
      // y_center we don't have directly — estimate from tube_idx * row_pitch
    });
  }
}

function effectiveDist(row, key){
  return key===151 ? (row.ov151 ?? row.d151) : (row.ov152 ?? row.d152);
}

// ────────────────────────────────────────────────────────────────────────────
// Table render
// ────────────────────────────────────────────────────────────────────────────
function renderTable(){
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  rows.forEach((row, ri)=>{
    const tr = document.createElement("tr");
    if(ri === activeIdx) tr.classList.add("active");

    const d151 = effectiveDist(row,151);
    const d152 = effectiveDist(row,152);
    const diff = (d151!=null&&d152!=null) ? d151-d152 : null;

    const tdI = el("td","td-i"); tdI.textContent = ri+1;

    const tdN = el("td","td-n");
    const span = el("span","name-disp"); span.textContent = row.name; span.title="Doble click para renombrar";
    span.addEventListener("dblclick",()=>startRename(row,span,tdN));
    tdN.appendChild(span);

    const td151c = el("td","td-d v151"+(row.ov151!=null?" ov":""));
    td151c.textContent = d151!=null ? d151.toFixed(3)+'"' : "—";
    if(d151==null) td151c.classList.add("empty");

    const td152c = el("td","td-d v152"+(row.ov152!=null?" ov":""));
    td152c.textContent = d152!=null ? d152.toFixed(3)+'"' : "—";
    if(d152==null) td152c.classList.add("empty");

    const tdDiff = el("td","td-d vdiff");
    if(diff!=null){
      tdDiff.textContent = (diff>=0?"+":"")+diff.toFixed(3)+'"';
      const a=Math.abs(diff);
      tdDiff.style.color = a>10?"#ff6060":a>5?"#ffb040":"#90d890";
    } else { tdDiff.textContent="—"; tdDiff.classList.add("empty"); }

    tr.append(tdI,tdN,td151c,td152c,tdDiff);
    tr.addEventListener("click",()=>{ activeIdx = ri===activeIdx?null:ri; renderTable(); redrawBoth(); scrollRowVisible(ri); });
    tbody.appendChild(tr);
  });
}

function scrollRowVisible(ri){
  const tr = document.getElementById("tbody").querySelectorAll("tr")[ri];
  tr?.scrollIntoView({block:"nearest"});
}

function el(tag,cls){ const e=document.createElement(tag); if(cls) e.className=cls; return e; }

function startRename(row, span, tdN){
  const inp = el("input","name-inp");
  inp.value = row.name;
  tdN.innerHTML=""; tdN.appendChild(inp);
  inp.focus(); inp.select();
  const done=()=>{ if(inp.value.trim()) row.name=inp.value.trim(); tdN.innerHTML=""; span.textContent=row.name; tdN.appendChild(span); redrawBoth(); };
  inp.addEventListener("blur",done);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter")inp.blur(); if(e.key==="Escape"){inp.value=row.name;inp.blur();} e.stopPropagation(); });
}

// ────────────────────────────────────────────────────────────────────────────
// Canvas / view helpers
// ────────────────────────────────────────────────────────────────────────────
function getEls(key){ const c=CAM[key]; return { wrap:document.getElementById(c.wrapId), imgC:document.getElementById(c.imgId), ovC:document.getElementById(c.ovId) }; }

function resize(key){
  const {wrap,imgC,ovC}=getEls(key);
  const w=wrap.clientWidth, h=wrap.clientHeight;
  imgC.width=ovC.width=w; imgC.height=ovC.height=h;
}
function fit(key){
  const s=CAM[key]; if(!s.img) return;
  const {wrap}=getEls(key);
  const cw=wrap.clientWidth, ch=wrap.clientHeight;
  const sc=Math.min(cw/s.img.width, ch/s.img.height);
  s.zoom=sc; s.ox=(cw-s.img.width*sc)/2; s.oy=(ch-s.img.height*sc)/2;
}
function i2c(s,ix,iy){ return {x:s.ox+ix*s.zoom, y:s.oy+iy*s.zoom}; }
function c2i(s,cx,cy){ return {x:(cx-s.ox)/s.zoom, y:(cy-s.oy)/s.zoom}; }

// ────────────────────────────────────────────────────────────────────────────
// Draw
// ────────────────────────────────────────────────────────────────────────────
function redrawBoth(){ drawSide(151); drawSide(152); }

function drawSide(key){
  const s=CAM[key];
  const {imgC,ovC}=getEls(key);
  const ictx=imgC.getContext("2d"), octx=ovC.getContext("2d");
  const cw=imgC.width, ch=imgC.height;

  // background + image
  ictx.clearRect(0,0,cw,ch); ictx.fillStyle="#020508"; ictx.fillRect(0,0,cw,ch);
  if(s.img){
    const p=i2c(s,0,0);
    ictx.drawImage(s.img, p.x,p.y, s.img.width*s.zoom, s.img.height*s.zoom);
  }

  octx.clearRect(0,0,cw,ch);
  if(!s.img||!s.data) return;

  const imgH = s.img.height;
  const items = s.data.items;

  // ── Reference lines ──────────────────────────────────────────────
  // The ref_x varies slightly per tube; draw the average as a vertical line
  const refXs = rows.map(r=>key===151?r.refX151:r.refX152).filter(v=>v!=null);
  const avgRefX = refXs.reduce((a,b)=>a+b,0)/refXs.length;
  {
    const rp1=i2c(s,avgRefX,0), rp2=i2c(s,avgRefX,imgH);
    octx.strokeStyle="rgba(255,200,60,.7)";
    octx.lineWidth=1.5; octx.setLineDash([6,4]);
    octx.beginPath(); octx.moveTo(rp1.x,rp1.y); octx.lineTo(rp2.x,rp2.y); octx.stroke();
    octx.setLineDash([]);
    octx.fillStyle="rgba(255,200,60,.85)"; octx.font="bold 9px system-ui";
    octx.fillText("REF", rp1.x+3, rp1.y+14);
  }

  // ── Tube positions + measurements ────────────────────────────────
  // Estimate y from tube order: distribute evenly in image height
  // (we don't have y in the JSON but can estimate from tube_idx / total count)
  const n=items.length;

  rows.forEach((row,ri)=>{
    const item = items[ri];
    if(!item) return;
    const sm = item.source_measurement;
    const xs = sm.x_start_warp;
    const refX = key===151?row.refX151:row.refX152;
    if(xs==null||refX==null) return;

    // Estimate y: tubes are ordered top-to-bottom in the warp image
    const iy = (ri + 0.5) / n * imgH;

    const isActive = ri===activeIdx;
    const hasOverride = key===151 ? row.ov151!=null : row.ov152!=null;

    // Horizontal measurement line (pre-computed or override)
    const distIn = effectiveDist(row,key);
    const usedXs = hasOverride
      ? (key===151 ? row._ovXs151 : row._ovXs152) ?? xs
      : xs;

    // dashed line from tube x to ref x
    const tp=i2c(s,usedXs,iy), rp=i2c(s,refX,iy);
    octx.strokeStyle = isActive ? "rgba(255,255,255,.7)" : (hasOverride?"rgba(255,220,80,.55)":"rgba(100,200,255,.35)");
    octx.lineWidth = isActive?1.5:1; octx.setLineDash([3,3]);
    octx.beginPath(); octx.moveTo(tp.x,tp.y); octx.lineTo(rp.x,rp.y); octx.stroke();
    octx.setLineDash([]);

    // Tube tick
    octx.strokeStyle = isActive ? "#ffffff" : (hasOverride?"#ffd060":s.color);
    octx.lineWidth = isActive?2:1;
    octx.beginPath(); octx.moveTo(tp.x,tp.y-7); octx.lineTo(tp.x,tp.y+7); octx.stroke();

    // Distance label
    if(distIn!=null){
      const txt = `${distIn.toFixed(2)}"`;
      const mx=(tp.x+rp.x)/2;
      octx.font = isActive?"bold 10px system-ui":"9px system-ui";
      const tw=octx.measureText(txt).width;
      octx.fillStyle="rgba(2,5,8,.7)"; octx.fillRect(mx-tw/2-1,tp.y-14,tw+2,12);
      octx.fillStyle = isActive?"#ffffff":(hasOverride?"#ffd060":"#a0d0f0");
      octx.fillText(txt, mx-tw/2, tp.y-4);
    }

    // Tube name label
    octx.fillStyle = isActive?"#ffffff":"rgba(160,200,230,.6)";
    octx.font = isActive?"bold 9px system-ui":"8px system-ui";
    octx.fillText(row.name, tp.x+5, tp.y+4);

    // Active ring
    if(isActive){
      octx.strokeStyle="rgba(255,255,255,.5)";
      octx.lineWidth=1.5;
      octx.beginPath(); octx.arc(tp.x,tp.y,9,0,Math.PI*2); octx.stroke();
    }
  });
}

// ────────────────────────────────────────────────────────────────────────────
// Interaction
// ────────────────────────────────────────────────────────────────────────────
function setupInteraction(key){
  const s=CAM[key];
  const {ovC}=getEls(key);

  // Zoom
  ovC.addEventListener("wheel",e=>{
    if(!s.img) return;
    e.preventDefault();
    const r=ovC.getBoundingClientRect();
    const cx=e.clientX-r.left, cy=e.clientY-r.top;
    const f=e.deltaY<0?1.13:1/1.13;
    const oz=s.zoom;
    s.zoom=Math.max(0.1,Math.min(60,s.zoom*f));
    s.ox=cx-(cx-s.ox)*(s.zoom/oz);
    s.oy=cy-(cy-s.oy)*(s.zoom/oz);
    drawSide(key);
  },{passive:false});

  ovC.addEventListener("pointerdown",e=>{
    if(!s.img) return;

    // Right or middle click → pan
    if(e.button===1||e.button===2){
      s.drag={sx:e.clientX,sy:e.clientY,ox:s.ox,oy:s.oy};
      ovC.setPointerCapture(e.pointerId);
      return;
    }

    // Left click → measure
    if(!rows.length){ setStatus("Sin datos."); return; }
    const r=ovC.getBoundingClientRect();
    const ip=c2i(s, e.clientX-r.left, e.clientY-r.top);

    // Find which row's y-band we clicked in
    const imgH=s.img.height;
    const n=rows.length;
    const riFloat = (ip.y / imgH) * n - 0.5;
    let ri = Math.round(riFloat);
    ri = Math.max(0, Math.min(n-1, ri));

    const row = rows[ri];
    const refX = key===151 ? row.refX151 : row.refX152;
    if(refX==null){ setStatus("Sin ref_x para este tubo."); return; }

    const dxPx = Math.abs(ip.x - refX);
    const dIn  = dxPx / s.pxPerIn;

    // Store override x for drawing
    if(key===151){ row.ov151=dIn; row._ovXs151=ip.x; }
    else         { row.ov152=dIn; row._ovXs152=ip.x; }

    activeIdx = ri;
    renderTable();
    redrawBoth();
    scrollRowVisible(ri);
    setStatus(`${row.name} cam${key}: ${dIn.toFixed(3)}" (click_x=${ip.x.toFixed(1)} ref_x=${refX.toFixed(1)} Δpx=${dxPx.toFixed(1)})`);
  });

  ovC.addEventListener("pointermove",e=>{
    if(!s.drag) return;
    s.ox=s.drag.ox+(e.clientX-s.drag.sx);
    s.oy=s.drag.oy+(e.clientY-s.drag.sy);
    drawSide(key);
  });
  ovC.addEventListener("pointerup",()=>{ s.drag=null; });
  ovC.addEventListener("contextmenu",e=>e.preventDefault());
}

// ────────────────────────────────────────────────────────────────────────────
// Reset overrides
// ────────────────────────────────────────────────────────────────────────────
document.getElementById("resetBtn").addEventListener("click",()=>{
  rows.forEach(r=>{ r.ov151=null; r.ov152=null; r._ovXs151=null; r._ovXs152=null; });
  activeIdx=null;
  renderTable(); redrawBoth();
  setStatus("Overrides borrados.");
});

// ────────────────────────────────────────────────────────────────────────────
// Export CSV
// ────────────────────────────────────────────────────────────────────────────
function doExport(){
  const header="Nombre,cam151_in,cam151_override,cam152_in,cam152_override,delta_in";
  const lines=rows.map(r=>{
    const d151=r.d151!=null?r.d151.toFixed(4):"";
    const o151=r.ov151!=null?r.ov151.toFixed(4):"";
    const d152=r.d152!=null?r.d152.toFixed(4):"";
    const o152=r.ov152!=null?r.ov152.toFixed(4):"";
    const eff151=r.ov151??r.d151, eff152=r.ov152??r.d152;
    const diff=(eff151!=null&&eff152!=null)?(eff151-eff152).toFixed(4):"";
    return `"${r.name.replace(/"/g,'""')}",${d151},${o151},${d152},${o152},${diff}`;
  });
  const blob=new Blob([[header,...lines].join("\n")],{type:"text/csv"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="mediciones_dia22.csv"; a.click(); URL.revokeObjectURL(a.href);
  setStatus(`CSV exportado — ${rows.length} filas.`);
}
document.getElementById("exportBtn").addEventListener("click",doExport);
document.getElementById("exportBtn2").addEventListener("click",doExport);

// ────────────────────────────────────────────────────────────────────────────
// Keyboard
// ────────────────────────────────────────────────────────────────────────────
window.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ activeIdx=null; renderTable(); redrawBoth(); return; }
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    const n=rows.length; if(!n) return;
    const cur=activeIdx??-1;
    activeIdx=e.key==="ArrowDown"?Math.min(cur+1,n-1):Math.max(cur-1,0);
    renderTable(); redrawBoth(); scrollRowVisible(activeIdx);
    e.preventDefault();
  }
  if(e.key==="Delete"||e.key==="Backspace"){
    if(activeIdx!=null){
      const r=rows[activeIdx];
      r.ov151=null; r.ov152=null; r._ovXs151=null; r._ovXs152=null;
      renderTable(); redrawBoth();
      setStatus(`Override borrado para ${r.name}.`);
      e.preventDefault();
    }
  }
});

// ────────────────────────────────────────────────────────────────────────────
// Resize
// ────────────────────────────────────────────────────────────────────────────
window.addEventListener("resize",()=>{
  [151,152].forEach(k=>{ resize(k); if(CAM[k].img) fit(k); });
  redrawBoth();
});

// ────────────────────────────────────────────────────────────────────────────
// Go
// ────────────────────────────────────────────────────────────────────────────
init().catch(err=>{ setStatus("Error: "+err.message); console.error(err); });
</script>
