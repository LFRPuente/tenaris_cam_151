<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homografia - picker</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-columns:minmax(0,1fr)350px;grid-template-rows:56px minmax(0,1fr);font-family:Arial,Helvetica,sans-serif;background:#101216;color:#edf2f7}header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid #2a3038;background:#171a20}h1{margin:0;font-size:17px;letter-spacing:0}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #3a4450;border-radius:6px;background:#222832;color:#f5f7fa;padding:8px 11px;font-size:13px;cursor:pointer}button:hover{background:#2c3440}button.primary{border-color:#1f9d55;background:#1f7a46}button.danger{border-color:#9f3a3a;background:#6b2a2a}button:disabled{opacity:.45;cursor:not-allowed}main{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr)34px;background:#0d0f13}#stage{width:100%;height:100%;display:block;background:#0b0d10;touch-action:none;cursor:crosshair}#status{padding:8px 12px;border-top:1px solid #2a3038;background:#171a20;color:#d7dee8;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}aside{min-height:0;overflow:auto;border-left:1px solid #2a3038;background:#151920;padding:12px}.panel{border:1px solid #2c3440;border-radius:8px;background:#1b2028;padding:10px;margin-bottom:12px}.panel h2{margin:0 0 8px;font-size:13px;text-transform:uppercase;color:#9fb0c2;letter-spacing:0}#preview{width:100%;height:auto;display:block;border:1px solid #303844;background:#0d0f13}.point-list{display:grid;gap:8px}.point-row{display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px;align-items:center;padding:8px;border-radius:6px;background:#222832}.badge{width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-weight:700;color:#0d0f13;font-size:12px}.coords{min-width:0;font-size:12px;color:#d7dee8;line-height:1.35;overflow-wrap:anywhere}.coords strong{display:block;color:#fff;font-size:13px}.help{margin:0;color:#b7c2ce;font-size:12px;line-height:1.45}@media(max-width:980px){body{grid-template-columns:1fr;grid-template-rows:auto minmax(62vh,1fr)auto}aside{border-left:0;border-top:1px solid #2a3038;max-height:38vh}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><h1>Homografia: TL, TR, BL, BR</h1><div class="actions"><button id="fitBtn">Centrar</button><button id="deleteBtn">Borrar ultimo</button><button id="clearBtn">Limpiar</button><button id="cancelBtn" class="danger">Cancelar</button><button id="confirmBtn" class="primary" disabled>Confirmar</button></div></header>
<main><canvas id="stage"></canvas><div id="status">Cargando imagen...</div></main>
<aside>
<section class="panel"><h2>Warp preview</h2><canvas id="preview" width="320" height="460"></canvas></section>
<section class="panel"><h2>Puntos</h2><div id="pointList" class="point-list"></div></section>
<section class="panel"><h2>Controles</h2><p class="help">Click izquierdo coloca el siguiente punto. Arrastra un punto para moverlo. Rueda del mouse hace zoom. Shift, click medio o click derecho arrastra la imagen. Enter confirma, Esc cancela y Delete borra el ultimo punto.</p></section>
</aside>
<script>
const INITIAL=__INITIAL_STATE__;
const LABELS=INITIAL.labels,NAMES=INITIAL.names,COLORS={TL:"#00ff44",TR:"#ffcc00",BL:"#ff4444",BR:"#44aaff"};
const stage=document.getElementById("stage"),ctx=stage.getContext("2d"),preview=document.getElementById("preview"),pctx=preview.getContext("2d");
const statusEl=document.getElementById("status"),confirmBtn=document.getElementById("confirmBtn"),pointList=document.getElementById("pointList");
const img=new Image(),srcCanvas=document.createElement("canvas"),srcCtx=srcCanvas.getContext("2d",{willReadFrequently:true});
let srcPixels=null,drag=null,previewDirty=false,submitted=false;
const state={pts:{},nextIdx:0,zoom:1,offsetX:0,offsetY:0,fitted:false,history:[]};
for(const l of LABELS){const p=INITIAL.existing[l];if(Array.isArray(p)&&p.length>=2)state.pts[l]={x:Number(p[0]),y:Number(p[1])};}
state.nextIdx=nextIndex();
function allPlaced(){return LABELS.every(l=>state.pts[l]);}
function nextIndex(){const i=LABELS.findIndex(l=>!state.pts[l]);return i>=0?i:state.nextIdx%LABELS.length;}
function clamp(p){return{x:Math.max(0,Math.min(img.naturalWidth,Number(p.x))),y:Math.max(0,Math.min(img.naturalHeight,Number(p.y)))};}
function canvasPoint(e){const r=stage.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function i2c(p){return{x:p.x*state.zoom+state.offsetX,y:p.y*state.zoom+state.offsetY};}
function c2i(p){return{x:(p.x-state.offsetX)/state.zoom,y:(p.y-state.offsetY)/state.zoom};}
function setStatus(t){statusEl.textContent=t;}
function fitImage(){if(!img.naturalWidth||!stage.width||!stage.height)return;const s=Math.min(stage.width/img.naturalWidth,stage.height/img.naturalHeight,1);state.zoom=Math.max(.02,s);state.offsetX=(stage.width-img.naturalWidth*state.zoom)/2;state.offsetY=(stage.height-img.naturalHeight*state.zoom)/2;state.fitted=true;draw();}
function resizeStage(){const r=stage.getBoundingClientRect();stage.width=Math.max(1,Math.round(r.width));stage.height=Math.max(1,Math.round(r.height));state.fitted?draw():fitImage();}
function hitPoint(cp){let best=null,bd=18;for(const l of LABELS){const p=state.pts[l];if(!p)continue;const d=i2c(p),dist=Math.hypot(cp.x-d.x,cp.y-d.y);if(dist<bd){bd=dist;best=l;}}return best;}
function placePoint(l,p){state.pts[l]=clamp(p);state.history.push(l);state.nextIdx=(LABELS.indexOf(l)+1)%LABELS.length;if(!allPlaced())state.nextIdx=nextIndex();markPreviewDirty();draw();}
function deleteLast(){let l=state.history.pop();if(!l||!state.pts[l])l=LABELS[(state.nextIdx+LABELS.length-1)%LABELS.length];if(l){delete state.pts[l];state.nextIdx=LABELS.indexOf(l);}markPreviewDirty();draw();}
function clearPoints(){state.pts={};state.history=[];state.nextIdx=0;markPreviewDirty();draw();}
function drawPointList(){pointList.innerHTML="";for(const l of LABELS){const row=document.createElement("div"),b=document.createElement("div"),c=document.createElement("div"),p=state.pts[l];row.className="point-row";b.className="badge";b.style.background=COLORS[l];b.textContent=l;c.className="coords";c.innerHTML=p?`<strong>${NAMES[l]}</strong>x=${p.x.toFixed(1)}, y=${p.y.toFixed(1)}`:`<strong>${NAMES[l]}</strong>sin colocar`;row.append(b,c);pointList.appendChild(row);}}
function draw(){
 ctx.clearRect(0,0,stage.width,stage.height);ctx.fillStyle="#0b0d10";ctx.fillRect(0,0,stage.width,stage.height);
 if(img.complete&&img.naturalWidth)ctx.drawImage(img,state.offsetX,state.offsetY,img.naturalWidth*state.zoom,img.naturalHeight*state.zoom);
 if(allPlaced()){const tl=i2c(state.pts.TL),tr=i2c(state.pts.TR),bl=i2c(state.pts.BL),br=i2c(state.pts.BR);ctx.save();ctx.strokeStyle="rgba(255,255,255,.78)";ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(tl.x,tl.y);ctx.lineTo(tr.x,tr.y);ctx.lineTo(br.x,br.y);ctx.lineTo(bl.x,bl.y);ctx.closePath();ctx.stroke();ctx.restore();}
 for(const l of LABELS){const p=state.pts[l];if(!p)continue;const d=i2c(p);ctx.save();ctx.strokeStyle=COLORS[l];ctx.fillStyle=COLORS[l];ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(d.x-10,d.y);ctx.lineTo(d.x+10,d.y);ctx.moveTo(d.x,d.y-10);ctx.lineTo(d.x,d.y+10);ctx.stroke();ctx.beginPath();ctx.arc(d.x,d.y,5,0,Math.PI*2);ctx.stroke();ctx.font="700 13px Arial,Helvetica,sans-serif";ctx.fillText(NAMES[l],d.x+12,d.y-10);ctx.restore();}
 confirmBtn.disabled=!allPlaced();drawPointList();if(allPlaced())setStatus("4/4 puntos colocados. Confirma para regresar al notebook.");else{const l=LABELS[state.nextIdx];setStatus(`Siguiente: ${NAMES[l]} (${Object.keys(state.pts).length}/4)`);}
}
function markPreviewDirty(){if(previewDirty)return;previewDirty=true;requestAnimationFrame(()=>{previewDirty=false;drawPreview();});}
function drawPreview(){
 pctx.clearRect(0,0,preview.width,preview.height);pctx.fillStyle="#0d0f13";pctx.fillRect(0,0,preview.width,preview.height);
 if(!allPlaced()||!srcPixels){pctx.fillStyle="#9fb0c2";pctx.font="14px Arial,Helvetica,sans-serif";pctx.textAlign="center";pctx.fillText(`${Object.keys(state.pts).length}/4 puntos`,preview.width/2,preview.height/2-8);pctx.fillText("P1 TL, P2 TR, P3 BL, P4 BR",preview.width/2,preview.height/2+14);pctx.textAlign="start";return;}
 const dst=[{x:0,y:0},{x:preview.width-1,y:0},{x:0,y:preview.height-1},{x:preview.width-1,y:preview.height-1}],src=[state.pts.TL,state.pts.TR,state.pts.BL,state.pts.BR],h=solveHomography(dst,src);if(!h)return;
 const out=pctx.createImageData(preview.width,preview.height),sd=srcPixels.data,sw=srcPixels.width,sh=srcPixels.height;
 for(let y=0;y<preview.height;y++){for(let x=0;x<preview.width;x++){const den=h[6]*x+h[7]*y+1,sx=(h[0]*x+h[1]*y+h[2])/den,sy=(h[3]*x+h[4]*y+h[5])/den,oi=(y*preview.width+x)*4,ix=Math.round(sx),iy=Math.round(sy);if(ix>=0&&ix<sw&&iy>=0&&iy<sh){const si=(iy*sw+ix)*4;out.data[oi]=sd[si];out.data[oi+1]=sd[si+1];out.data[oi+2]=sd[si+2];out.data[oi+3]=255;}else{out.data[oi]=13;out.data[oi+1]=15;out.data[oi+2]=19;out.data[oi+3]=255;}}}
 pctx.putImageData(out,0,0);pctx.save();pctx.font="700 13px Arial,Helvetica,sans-serif";[["P1",4,15,COLORS.TL],["P2",preview.width-28,15,COLORS.TR],["P3",4,preview.height-8,COLORS.BL],["P4",preview.width-28,preview.height-8,COLORS.BR]].forEach(a=>{pctx.fillStyle=a[3];pctx.fillText(a[0],a[1],a[2]);});pctx.restore();
}
function solveHomography(from,to){const a=[],b=[];for(let i=0;i<4;i++){const x=from[i].x,y=from[i].y,u=to[i].x,v=to[i].y;a.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);a.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v);}const s=gauss(a,b);return s?[s[0],s[1],s[2],s[3],s[4],s[5],s[6],s[7],1]:null;}
function gauss(a,b){const n=b.length;for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(a[r][c])>Math.abs(a[p][c]))p=r;if(Math.abs(a[p][c])<1e-10)return null;if(p!==c){[a[p],a[c]]=[a[c],a[p]];[b[p],b[c]]=[b[c],b[p]];}const d=a[c][c];for(let j=c;j<n;j++)a[c][j]/=d;b[c]/=d;for(let r=0;r<n;r++){if(r===c)continue;const f=a[r][c];for(let j=c;j<n;j++)a[r][j]-=f*a[c][j];b[r]-=f*b[c];}}return b;}
stage.addEventListener("pointerdown",e=>{e.preventDefault();stage.setPointerCapture(e.pointerId);const cp=canvasPoint(e);if(e.button===1||e.button===2||e.shiftKey||e.altKey){drag={type:"pan",sx:e.clientX,sy:e.clientY,ox:state.offsetX,oy:state.offsetY};return;}if(e.button!==0)return;const hit=hitPoint(cp);if(hit){drag={type:"point",label:hit};return;}const ip=c2i(cp);if(ip.x>=0&&ip.x<=img.naturalWidth&&ip.y>=0&&ip.y<=img.naturalHeight)placePoint(LABELS[state.nextIdx],ip);});
stage.addEventListener("pointermove",e=>{if(!drag)return;e.preventDefault();if(drag.type==="pan"){state.offsetX=drag.ox+e.clientX-drag.sx;state.offsetY=drag.oy+e.clientY-drag.sy;draw();return;}state.pts[drag.label]=clamp(c2i(canvasPoint(e)));markPreviewDirty();draw();});
function stopDrag(e){if(stage.hasPointerCapture(e.pointerId))stage.releasePointerCapture(e.pointerId);drag=null;}stage.addEventListener("pointerup",stopDrag);stage.addEventListener("pointercancel",stopDrag);stage.addEventListener("contextmenu",e=>e.preventDefault());
stage.addEventListener("wheel",e=>{e.preventDefault();const cp=canvasPoint(e),before=c2i(cp),f=e.deltaY<0?1.12:1/1.12;state.zoom=Math.max(.02,Math.min(30,state.zoom*f));state.offsetX=cp.x-before.x*state.zoom;state.offsetY=cp.y-before.y*state.zoom;draw();},{passive:false});
async function submitResult(confirmed){if(submitted)return;submitted=true;const payload={confirmed,pts:{}};if(confirmed){for(const l of LABELS)payload.pts[l]=[state.pts[l].x,state.pts[l].y];}try{await fetch("/result",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});}finally{setStatus(confirmed?"Confirmado. Puedes volver al notebook.":"Cancelado. Puedes volver al notebook.");setTimeout(()=>window.close(),250);}}
document.getElementById("fitBtn").onclick=fitImage;document.getElementById("deleteBtn").onclick=deleteLast;document.getElementById("clearBtn").onclick=clearPoints;document.getElementById("cancelBtn").onclick=()=>submitResult(false);confirmBtn.onclick=()=>{if(allPlaced())submitResult(true);};
window.addEventListener("keydown",e=>{if(e.key==="Enter"&&allPlaced())submitResult(true);if(e.key==="Escape")submitResult(false);if(e.key==="Delete"||e.key==="Backspace"){e.preventDefault();deleteLast();}});
window.addEventListener("resize",resizeStage);
window.addEventListener("beforeunload",()=>{if(!submitted)navigator.sendBeacon("/result",JSON.stringify({confirmed:false}));});
img.onload=()=>{srcCanvas.width=img.naturalWidth;srcCanvas.height=img.naturalHeight;srcCtx.drawImage(img,0,0);srcPixels=srcCtx.getImageData(0,0,img.naturalWidth,img.naturalHeight);resizeStage();markPreviewDirty();};
img.onerror=()=>setStatus("No se pudo cargar la imagen.");img.src="/image";
</script>
</body>
</html>
