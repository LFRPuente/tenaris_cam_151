<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HK - Sorting Table</title>
<style>
:root{
  --bg:#efe6ca;
  --panel:#fffdfa;
  --ink:#1f2228;
  --muted:#6b6d73;
  --line:#2c2f34;
  --band:#474543;
  --band-accent:#cb2f84;
  --table-head:#4b4948;
  --card:#f6f1de;
  --blue:#0c41ff;
  --blue-deep:#0b27b7;
  --selected:#d7eefc;
  --warn:#f2a84b;
  --bubble:#6fa7d5;
  --bubble-text:#ffffff;
  --bubble-stroke:#152131;
  --shadow:0 20px 50px rgba(72,54,16,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at top left, rgba(255,255,255,.55), transparent 32%),
    linear-gradient(180deg, #f6edd4 0%, var(--bg) 38%, #e8debd 100%);
  color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",Tahoma,sans-serif;
}
.shell{
  max-width:1800px;
  margin:0 auto;
  padding:24px 22px 28px;
  animation:fadeUp .36s ease;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:18px;
}
.eyebrow{
  margin:0 0 6px;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#735e28;
}
.title{
  margin:0;
  font-size:30px;
  line-height:1.05;
  letter-spacing:.02em;
}
.subtitle{
  margin:8px 0 0;
  color:var(--muted);
  font-size:14px;
  line-height:1.4;
}
.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.action-status{
  min-height:18px;
  margin-bottom:14px;
  padding:0 2px;
  font-size:13px;
  color:#5c533d;
}
.action-status.error{
  color:#8c1f1f;
}
button{
  border:1px solid #8e7b42;
  border-radius:999px;
  padding:10px 16px;
  background:#443919;
  color:#fff8e7;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 10px 20px rgba(58,46,17,.15);
}
button.secondary{
  background:#fff8e2;
  color:#47391a;
}
button:hover{transform:translateY(-1px)}
.meta-strip{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  margin-bottom:18px;
}
.meta-card{
  background:rgba(255,253,246,.9);
  border:1px solid rgba(76,69,55,.2);
  border-radius:18px;
  padding:14px 16px;
  box-shadow:var(--shadow);
}
.meta-label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:#796d53;
}
.meta-value{
  margin-top:6px;
  font-size:28px;
  font-weight:800;
}
.workspace{
  display:grid;
  grid-template-columns:minmax(520px,1.05fr) minmax(620px,.95fr);
  gap:18px;
  align-items:start;
}
.panel{
  background:rgba(255,252,246,.96);
  border:1px solid rgba(78,70,55,.22);
  border-radius:26px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.panel-band{
  padding:20px 24px 18px;
  background:var(--band);
  border-bottom:3px solid var(--band-accent);
  color:#fff;
}
.panel-band h2{
  margin:0;
  font-size:24px;
  letter-spacing:.02em;
  text-align:center;
}
.table-wrap{
  padding:0;
  overflow:auto;
}
table{
  width:100%;
  border-collapse:collapse;
}
thead th{
  position:sticky;
  top:0;
  background:var(--table-head);
  color:#fff;
  font-size:18px;
  padding:12px 10px;
  border:1px solid var(--line);
  text-align:center;
}
tbody td{
  background:#f8f8f8;
  border:1px solid var(--line);
  padding:10px 12px;
  font-size:17px;
  text-align:center;
  cursor:pointer;
  transition:background .15s ease, color .15s ease, box-shadow .15s ease;
}
tbody tr:nth-child(odd) td{
  background:#f2f2f2;
}
tbody tr:hover td{
  background:#edf5fb;
}
tbody tr.selected td{
  background:var(--selected);
  box-shadow:inset 0 0 0 1px rgba(39,86,120,.14);
}
tbody tr.selected td:first-child{
  background:#4e6f8a;
  color:#fff;
  font-weight:800;
}
tbody tr.warn td{
  background:#fff2df;
}
tbody tr.warn.selected td{
  background:var(--selected);
}
tbody tr.warn.selected td:first-child{
  background:#4e6f8a;
  color:#fff;
}
.status-note{
  padding:14px 18px 18px;
  font-size:13px;
  color:var(--muted);
}
.viewers{
  display:grid;
  gap:16px;
  padding:18px;
}
.view-card{
  background:var(--card);
  border-radius:20px;
  border:1px solid rgba(58,52,39,.18);
  overflow:hidden;
}
.view-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px 16px 12px;
  border-bottom:1px solid rgba(58,52,39,.12);
}
.view-title{
  margin:0;
  font-size:20px;
}
.view-sub{
  margin-top:4px;
  font-size:12px;
  color:var(--muted);
}
.view-toolbar{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.view-toolbar button{
  padding:7px 10px;
  min-width:46px;
  border-radius:12px;
  font-size:12px;
}
.view-toolbar [data-zoom-action="reset"]{
  min-width:72px;
  font-variant-numeric:tabular-nums;
}
.view-toolbar .secondary{
  background:#fbf3d8;
}
.view-help{
  padding:0 16px 10px;
  font-size:11px;
  color:#77684a;
  letter-spacing:.01em;
}
.viewer-scroll{
  overflow:auto;
  max-height:740px;
  background:
    linear-gradient(180deg, rgba(17,34,86,.08), rgba(17,34,86,.02)),
    #ece2c7;
  overscroll-behavior:contain;
}
.viewer-scroll.can-pan{cursor:grab}
.viewer-scroll.is-panning{cursor:grabbing}
.viewer-stage{
  position:relative;
  transform-origin:top left;
  will-change:transform;
}
.viewer-image{
  display:block;
  max-width:none;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
}
.viewer-overlay{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
}
.marker{
  transition:opacity .14s ease, filter .14s ease;
}
.marker-line{
  stroke:#fffdf7;
  stroke-width:.95;
  opacity:.46;
}
.marker-dot{
  fill:#fff1a8;
  stroke:#17202d;
  stroke-width:.95;
  opacity:.9;
}
.marker-box{
  stroke:#f6fbff;
  stroke-width:.85;
  fill-opacity:.72;
}
.marker-text{
  fill:#ffffff;
  font-size:8px;
  font-weight:700;
  text-anchor:middle;
  dominant-baseline:middle;
  paint-order:stroke fill;
  stroke:rgba(14,21,30,.38);
  stroke-width:1px;
  letter-spacing:.01em;
}
.marker-small{
  fill:#0f1922;
  font-size:6px;
  font-weight:700;
  text-anchor:middle;
  paint-order:stroke fill;
  stroke:rgba(255,250,232,.5);
  stroke-width:1px;
  opacity:0;
  transition:opacity .14s ease;
}
.marker:hover .marker-small,
.marker.active .marker-small{
  opacity:.92;
}
.marker.active .marker-line,
.marker.active .marker-box,
.marker.active .marker-dot{
  filter:drop-shadow(0 0 4px rgba(255,255,255,.52));
}
.marker.active .marker-line{
  stroke-width:2.15;
  opacity:.96;
}
.marker.active .marker-box{
  stroke:#ffffff;
  stroke-width:1.55;
  fill:#111111;
  fill-opacity:.96;
}
.marker.active .marker-dot{
  stroke-width:1.8;
}
.legend{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  padding:0 18px 18px;
  font-size:12px;
  color:var(--muted);
}
.legend-item{
  display:flex;
  align-items:center;
  gap:6px;
}
.legend-chip{
  width:16px;
  height:16px;
  border-radius:999px;
  display:inline-block;
}
.empty{
  padding:24px;
  text-align:center;
  color:var(--muted);
}
@media(max-width:1320px){
  .workspace{grid-template-columns:1fr}
}
@media(max-width:820px){
  .shell{padding:18px 14px 22px}
  .topbar{flex-direction:column}
  .meta-strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .panel-band h2{font-size:21px}
  thead th{font-size:16px}
  tbody td{font-size:15px}
}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div>
      <h1 class="title" id="pageTitle">HK - Sorting Table</h1>
      <p class="subtitle" id="pageSubtitle"></p>
    </div>
    <div class="actions">
      <button type="button" id="captureBtn">Download and Process</button>
      <button type="button" class="secondary" id="historyBtn">History</button>
      <button type="button" class="secondary" id="latestBtn" hidden>View Latest</button>
      <button type="button" class="secondary" id="clearSelectionBtn">Clear Selection</button>
      <button type="button" id="refreshBtn">Reload View</button>
    </div>
  </div>

  <div class="action-status" id="actionStatus"></div>

  <div class="meta-strip">
    <div class="meta-card">
      <div class="meta-label">Pipe Count</div>
      <div class="meta-value" id="metricPipes">0</div>
    </div>
    <div class="meta-card">
      <div class="meta-label">Matched</div>
      <div class="meta-value" id="metricMatched">0</div>
    </div>
    <div class="meta-card">
      <div class="meta-label">Left Only</div>
      <div class="meta-value" id="metricLeftOnly">0</div>
    </div>
    <div class="meta-card">
      <div class="meta-label">Right Only</div>
      <div class="meta-value" id="metricRightOnly">0</div>
    </div>
    <div class="meta-card">
      <div class="meta-label">Detector</div>
      <div class="meta-value" id="metricDetector">-</div>
    </div>
  </div>

  <div class="workspace">
    <section class="panel">
      <div class="panel-band">
        <h2>HK - SORTING TABLE</h2>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Pipe #</th>
              <th>Pipe Length (In)</th>
              <th>Pipe Length (Ft)</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div class="empty" id="tableEmpty" hidden>No rows to display.</div>
      </div>
      <div class="status-note" id="tableNote"></div>
    </section>

    <section class="panel">
      <div class="viewers">
        <section class="view-card">
          <div class="view-head">
            <div>
              <h3 class="view-title" id="viewer151Title">RAW LEFT</h3>
              <div class="view-sub" id="viewer151Meta"></div>
            </div>
            <div class="view-toolbar">
              <button type="button" class="secondary" data-zoom-side="151" data-zoom-action="out">-</button>
              <button type="button" class="secondary" data-zoom-side="151" data-zoom-action="reset">100%</button>
              <button type="button" class="secondary" data-zoom-side="151" data-zoom-action="in">+</button>
            </div>
          </div>
          <div class="view-help">Wheel: zoom. Middle button: drag.</div>
          <div class="viewer-scroll" id="viewer151Scroll">
            <div class="viewer-stage" id="viewer151Stage">
              <img class="viewer-image" id="viewer151Image" alt="RAW LEFT">
              <svg class="viewer-overlay" id="viewer151Overlay"></svg>
            </div>
          </div>
        </section>

        <section class="view-card">
          <div class="view-head">
            <div>
              <h3 class="view-title" id="viewer152Title">RAW RIGHT</h3>
              <div class="view-sub" id="viewer152Meta"></div>
            </div>
            <div class="view-toolbar">
              <button type="button" class="secondary" data-zoom-side="152" data-zoom-action="out">-</button>
              <button type="button" class="secondary" data-zoom-side="152" data-zoom-action="reset">100%</button>
              <button type="button" class="secondary" data-zoom-side="152" data-zoom-action="in">+</button>
            </div>
          </div>
          <div class="view-help">Wheel: zoom. Middle button: drag.</div>
          <div class="viewer-scroll" id="viewer152Scroll">
            <div class="viewer-stage" id="viewer152Stage">
              <img class="viewer-image" id="viewer152Image" alt="RAW RIGHT">
              <svg class="viewer-overlay" id="viewer152Overlay"></svg>
            </div>
          </div>
        </section>
      </div>

      <div class="legend">
        <div class="legend-item"><span class="legend-chip" style="background:#54b8ff"></span>Full match</div>
        <div class="legend-item"><span class="legend-chip" style="background:#f2a84b"></span>Row with a missing side</div>
      </div>
    </section>
  </div>
</div>

<script>
const INITIAL = __INITIAL_STATE__;
const SVG_NS = "http://www.w3.org/2000/svg";

const state = {
  selectedTube: null,
  zoom: {"151": 1, "152": 1},
  initialFocusDone: {"151": false, "152": false},
  markerLayout: {"151": [], "152": []},
};

const panState = {
  active: false,
  sideKey: null,
  startClientX: 0,
  startClientY: 0,
  startScrollLeft: 0,
  startScrollTop: 0,
};

const els = {
  pageTitle: document.getElementById("pageTitle"),
  pageSubtitle: document.getElementById("pageSubtitle"),
  metricPipes: document.getElementById("metricPipes"),
  metricMatched: document.getElementById("metricMatched"),
  metricLeftOnly: document.getElementById("metricLeftOnly"),
  metricRightOnly: document.getElementById("metricRightOnly"),
  metricDetector: document.getElementById("metricDetector"),
  tableBody: document.getElementById("tableBody"),
  tableEmpty: document.getElementById("tableEmpty"),
  tableNote: document.getElementById("tableNote"),
  actionStatus: document.getElementById("actionStatus"),
  refreshBtn: document.getElementById("refreshBtn"),
  captureBtn: document.getElementById("captureBtn"),
  historyBtn: document.getElementById("historyBtn"),
  latestBtn: document.getElementById("latestBtn"),
  clearSelectionBtn: document.getElementById("clearSelectionBtn"),
  viewers: {
    "151": {
      title: document.getElementById("viewer151Title"),
      meta: document.getElementById("viewer151Meta"),
      scroll: document.getElementById("viewer151Scroll"),
      stage: document.getElementById("viewer151Stage"),
      image: document.getElementById("viewer151Image"),
      overlay: document.getElementById("viewer151Overlay"),
      zoomLabel: document.querySelector('[data-zoom-side="151"][data-zoom-action="reset"]'),
    },
    "152": {
      title: document.getElementById("viewer152Title"),
      meta: document.getElementById("viewer152Meta"),
      scroll: document.getElementById("viewer152Scroll"),
      stage: document.getElementById("viewer152Stage"),
      image: document.getElementById("viewer152Image"),
      overlay: document.getElementById("viewer152Overlay"),
      zoomLabel: document.querySelector('[data-zoom-side="152"][data-zoom-action="reset"]'),
    },
  },
};

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function formatGeneratedAt(value){
  if(!value) return "-";
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return String(value);
  return `${date.toLocaleDateString()} ${date.toLocaleTimeString()}`;
}

function summary(){
  return INITIAL.summary || {};
}

function runInfo(){
  return INITIAL.current_run || null;
}

function rows(){
  return Array.isArray(INITIAL.rows) ? INITIAL.rows : [];
}

function detectorLabel(){
  const source = String(summary().detection_source || "").toLowerCase();
  if(source === "yolo_pipe_end") return "YOLO";
  if(source) return source;
  return "-";
}

function imageState(side){
  return (INITIAL.images || {})[String(side)] || {};
}

function setSelectedTube(tubeNumber, options = {}){
  state.selectedTube = tubeNumber === null ? null : Number(tubeNumber);
  renderHeader();
  applyEnglishHeaderState();
  renderTable();
  renderViewers();
  if(options.focusSelection && state.selectedTube !== null){
    requestAnimationFrame(() => {
      focusSelectionInViewers(state.selectedTube);
    });
  }
}

function isWarningStatus(status){
  return ["left_only","right_only","left_only_manual","right_only_manual"].includes(String(status || ""));
}

function setActionStatus(message, options = {}){
  els.actionStatus.textContent = String(message || "");
  els.actionStatus.classList.toggle("error", Boolean(options.error));
}

function applyEnglishCopy(){
  els.clearSelectionBtn.textContent = "Clear Selection";
  els.tableEmpty.textContent = "No rows to display.";
  for(const node of document.querySelectorAll(".view-help")){
    node.textContent = "Wheel: zoom. Middle button: drag.";
  }
  const legendItems = document.querySelectorAll(".legend-item");
  if(legendItems[0]){
    legendItems[0].innerHTML = '<span class="legend-chip" style="background:#54b8ff"></span>Full match';
  }
  if(legendItems[1]){
    legendItems[1].innerHTML = '<span class="legend-chip" style="background:#f2a84b"></span>Row with a missing side';
  }
}

function renderHeader(){
  const currentRun = runInfo();
  const subtitleParts = [
    `Generated ${formatGeneratedAt(INITIAL.generated_at)}`,
    `Source: ${INITIAL.match_source || "latest"}`,
  ];
  if(currentRun && currentRun.run_id){
    subtitleParts.push(`Run: ${currentRun.run_id}`);
  }
  if(currentRun && currentRun.captured_at){
    subtitleParts.push(`Capture: ${formatGeneratedAt(currentRun.captured_at)}`);
  }
  els.pageTitle.textContent = INITIAL.title || "HK - Sorting Table";
  els.pageSubtitle.textContent = subtitleParts.join(" | ");
  els.metricPipes.textContent = String(summary().pipe_count || rows().length || 0);
  els.metricMatched.textContent = String(summary().matched || 0);
  els.metricLeftOnly.textContent = String(summary().left_only || 0);
  els.metricRightOnly.textContent = String(summary().right_only || 0);
  els.metricDetector.textContent = detectorLabel();
  els.latestBtn.hidden = Boolean(INITIAL.is_latest_view);
  if(currentRun && currentRun.run_id){
    setActionStatus(
      INITIAL.is_latest_view
        ? `Active latest: ${currentRun.run_id}.`
        : `Viewing historical run ${currentRun.run_id}.`
    );
  } else {
    setActionStatus("");
  }
  els.tableNote.textContent = state.selectedTube === null
    ? "Select a row, value, or marker to highlight the same pipe. Use the wheel to zoom and the middle button to drag."
    : `Pipe #${state.selectedTube} selected in both cameras.`;
}

function applyEnglishHeaderState(){
  const currentRun = runInfo();
  if(currentRun && currentRun.run_id){
    setActionStatus(
      INITIAL.is_latest_view
        ? `Active latest: ${currentRun.run_id}.`
        : `Viewing historical run ${currentRun.run_id}.`
    );
  } else {
    setActionStatus("");
  }
  els.tableNote.textContent = state.selectedTube === null
    ? "Select a row, value, or marker to highlight the same pipe. Use the wheel to zoom and the middle button to drag."
    : `Pipe #${state.selectedTube} selected in both cameras.`;
}

function renderTable(){
  const data = rows();
  if(!data.length){
    els.tableBody.innerHTML = "";
    els.tableEmpty.hidden = false;
    return;
  }
  els.tableEmpty.hidden = true;
  els.tableBody.innerHTML = data.map((row) => {
    const selected = Number(row.tube_number) === state.selectedTube;
    const warn = isWarningStatus(row.match_status);
    const title = row.observations ? ` title="${escapeHtml(row.observations)}"` : "";
    return `
      <tr class="${selected ? "selected" : ""} ${warn ? "warn" : ""}" data-tube-number="${row.tube_number}"${title}>
        <td>${row.tube_number}</td>
        <td>${escapeHtml(row.length_in_display || "-")}</td>
        <td>${escapeHtml(row.length_ft_display || "-")}</td>
      </tr>
    `;
  }).join("");
  for(const rowEl of els.tableBody.querySelectorAll("tr[data-tube-number]")){
    rowEl.addEventListener("click", () => {
      setSelectedTube(Number(rowEl.dataset.tubeNumber), {focusSelection:true});
    });
  }
}

function layoutMarkers(sideKey, markers, width, height){
  const marginY = 10;
  const minYGap = 12;
  const labelGap = 6;
  const laneStep = 10;
  const sorted = markers
    .map((marker) => ({...marker}))
    .sort((a, b) => Number(a.y) - Number(b.y));
  const prepared = sorted.map((marker) => {
    const label = String(marker.tube_number ?? "");
    const boxWidth = label.length > 1 ? 24 : 16;
    const boxHeight = 12;
    const minBoxX = 6;
    const maxBoxX = Math.max(minBoxX, width - boxWidth - 6);
    const placeRight = String(sideKey) === "151";
    const preferredLeftBoxX = Number(marker.x) - boxWidth - labelGap;
    const labelY = Math.max(marginY, Math.min(height - marginY, Number(marker.y)));
    const preferredRightBoxX = Number(marker.x) + labelGap;
    return {
      ...marker,
      label,
      boxWidth,
      boxHeight,
      minBoxX,
      maxBoxX,
      placeRight,
      preferredLeftBoxX,
      preferredRightBoxX,
      labelY,
    };
  });
  const laneLastY = [];
  return prepared.map((marker) => {
    let laneIndex = 0;
    while(laneIndex < laneLastY.length && (marker.labelY - laneLastY[laneIndex]) < minYGap){
      laneIndex += 1;
    }
    laneLastY[laneIndex] = marker.labelY;
    const shiftedBoxX = marker.placeRight
      ? marker.preferredRightBoxX + (laneIndex * laneStep)
      : marker.preferredLeftBoxX - (laneIndex * laneStep);
    const boxX = Math.max(marker.minBoxX, Math.min(marker.maxBoxX, shiftedBoxX));
    const anchorX = marker.placeRight ? boxX : boxX + marker.boxWidth;
    return {
      ...marker,
      laneIndex,
      boxX,
      boxY: marker.labelY - marker.boxHeight / 2,
      anchorX,
    };
  });
}

function clampZoom(value){
  return Math.max(0.45, Math.min(4.5, Number(value) || 1));
}

function updateZoomLabel(sideKey){
  const viewer = els.viewers[String(sideKey)];
  if(!viewer || !viewer.zoomLabel) return;
  viewer.zoomLabel.textContent = `${Math.round((state.zoom[String(sideKey)] || 1) * 100)}%`;
}

function applyZoom(sideKey){
  const viewer = els.viewers[String(sideKey)];
  if(!viewer) return;
  const zoom = clampZoom(state.zoom[String(sideKey)] || 1);
  viewer.stage.style.transform = `scale(${zoom})`;
  viewer.scroll.classList.add("can-pan");
  updateZoomLabel(sideKey);
}

function setZoom(sideKey, nextZoom, focusPoint = null){
  const viewer = els.viewers[String(sideKey)];
  if(!viewer) return;
  const previousZoom = clampZoom(state.zoom[String(sideKey)] || 1);
  const zoom = clampZoom(nextZoom);
  if(Math.abs(zoom - previousZoom) < 0.0001){
    applyZoom(sideKey);
    return;
  }
  let focusX = viewer.scroll.clientWidth / 2;
  let focusY = viewer.scroll.clientHeight / 2;
  if(focusPoint){
    const rect = viewer.scroll.getBoundingClientRect();
    focusX = focusPoint.clientX - rect.left;
    focusY = focusPoint.clientY - rect.top;
  }
  const logicalX = (viewer.scroll.scrollLeft + focusX) / previousZoom;
  const logicalY = (viewer.scroll.scrollTop + focusY) / previousZoom;
  state.zoom[String(sideKey)] = zoom;
  applyZoom(sideKey);
  const nextLeft = Math.max(0, logicalX * zoom - focusX);
  const nextTop = Math.max(0, logicalY * zoom - focusY);
  viewer.scroll.scrollLeft = nextLeft;
  viewer.scroll.scrollTop = nextTop;
  requestAnimationFrame(() => {
    viewer.scroll.scrollLeft = nextLeft;
    viewer.scroll.scrollTop = nextTop;
  });
}

function focusViewerOnMarkers(sideKey, laidOut){
  const viewer = els.viewers[String(sideKey)];
  if(!viewer || state.initialFocusDone[String(sideKey)] || !laidOut.length){
    return;
  }
  const zoom = clampZoom(state.zoom[String(sideKey)] || 1);
  const minX = Math.min(...laidOut.map((marker) => Math.min(Number(marker.x), Number(marker.boxX)))) - 28;
  const maxX = Math.max(...laidOut.map((marker) => Math.max(Number(marker.x), Number(marker.boxX) + Number(marker.boxWidth)))) + 28;
  const minY = Math.min(...laidOut.map((marker) => Math.min(Number(marker.y), Number(marker.boxY)))) - 40;
  const maxY = Math.max(...laidOut.map((marker) => Math.max(Number(marker.y), Number(marker.boxY) + Number(marker.boxHeight)))) + 40;
  const contentCenterX = Math.max(0, (minX + maxX) * 0.5);
  const contentCenterY = Math.max(0, (minY + maxY) * 0.5);
  const targetLeft = Math.max(0, (contentCenterX * zoom) - (viewer.scroll.clientWidth * 0.5));
  const targetTop = Math.max(0, (contentCenterY * zoom) - (viewer.scroll.clientHeight * 0.5));
  const applyFocus = () => {
    viewer.scroll.scrollLeft = targetLeft;
    viewer.scroll.scrollTop = targetTop;
    state.initialFocusDone[String(sideKey)] = true;
  };
  requestAnimationFrame(() => {
    applyFocus();
    requestAnimationFrame(applyFocus);
  });
}

function focusViewerOnTube(sideKey, tubeNumber){
  const viewer = els.viewers[String(sideKey)];
  const laidOut = state.markerLayout[String(sideKey)] || [];
  if(!viewer || !laidOut.length){
    return;
  }
  const marker = laidOut.find((item) => Number(item.tube_number) === Number(tubeNumber));
  if(!marker){
    return;
  }
  const targetZoom = Math.max(1.85, clampZoom(state.zoom[String(sideKey)] || 1));
  state.zoom[String(sideKey)] = targetZoom;
  applyZoom(sideKey);

  const minX = Math.min(Number(marker.x), Number(marker.boxX)) - 26;
  const maxX = Math.max(Number(marker.x), Number(marker.boxX) + Number(marker.boxWidth)) + 26;
  const minY = Math.min(Number(marker.y), Number(marker.boxY)) - 34;
  const maxY = Math.max(Number(marker.y), Number(marker.boxY) + Number(marker.boxHeight)) + 34;
  const focusCenterX = Math.max(0, 0.5 * (minX + maxX));
  const focusCenterY = Math.max(0, 0.5 * (minY + maxY));
  const targetLeft = Math.max(0, (focusCenterX * targetZoom) - (viewer.scroll.clientWidth * 0.5));
  const targetTop = Math.max(0, (focusCenterY * targetZoom) - (viewer.scroll.clientHeight * 0.5));

  const applyFocus = () => {
    viewer.scroll.scrollLeft = targetLeft;
    viewer.scroll.scrollTop = targetTop;
  };
  requestAnimationFrame(() => {
    applyFocus();
    requestAnimationFrame(applyFocus);
  });
}

function focusSelectionInViewers(tubeNumber){
  focusViewerOnTube("151", tubeNumber);
  focusViewerOnTube("152", tubeNumber);
}

function stopPan(){
  if(!panState.active) return;
  const viewer = els.viewers[String(panState.sideKey)];
  if(viewer){
    viewer.scroll.classList.remove("is-panning");
  }
  panState.active = false;
  panState.sideKey = null;
  window.removeEventListener("mousemove", handlePanMove);
  window.removeEventListener("mouseup", stopPan);
  window.removeEventListener("blur", stopPan);
}

function handlePanMove(event){
  if(!panState.active) return;
  const viewer = els.viewers[String(panState.sideKey)];
  if(!viewer) return;
  viewer.scroll.scrollLeft = panState.startScrollLeft - (event.clientX - panState.startClientX);
  viewer.scroll.scrollTop = panState.startScrollTop - (event.clientY - panState.startClientY);
}

function bindViewerInteractions(sideKey){
  const viewer = els.viewers[String(sideKey)];
  if(!viewer) return;
  viewer.scroll.addEventListener("wheel", (event) => {
    event.preventDefault();
    const factor = event.deltaY < 0 ? 1.12 : (1 / 1.12);
    setZoom(sideKey, (state.zoom[String(sideKey)] || 1) * factor, event);
  }, {passive:false});
  viewer.scroll.addEventListener("mousedown", (event) => {
    if(event.button !== 1) return;
    event.preventDefault();
    panState.active = true;
    panState.sideKey = String(sideKey);
    panState.startClientX = event.clientX;
    panState.startClientY = event.clientY;
    panState.startScrollLeft = viewer.scroll.scrollLeft;
    panState.startScrollTop = viewer.scroll.scrollTop;
    viewer.scroll.classList.add("is-panning");
    window.addEventListener("mousemove", handlePanMove);
    window.addEventListener("mouseup", stopPan);
    window.addEventListener("blur", stopPan);
  });
  viewer.scroll.addEventListener("auxclick", (event) => {
    if(event.button === 1){
      event.preventDefault();
    }
  });
}

function renderViewer(sideKey){
  const viewer = els.viewers[String(sideKey)];
  const meta = imageState(sideKey);
  const width = Number(meta.width || 0);
  const height = Number(meta.height || 0);
  const markers = Array.isArray(meta.markers) ? meta.markers : [];
  viewer.title.textContent = meta.title || `RAW ${sideKey}`;
  viewer.meta.textContent = `${meta.image_name || "no image"} | ${markers.length} numbered pipes`;
  viewer.image.src = meta.url || "";
  viewer.stage.style.width = `${width}px`;
  viewer.stage.style.height = `${height}px`;
  viewer.overlay.setAttribute("viewBox", `0 0 ${width} ${height}`);
  viewer.overlay.setAttribute("width", String(width));
  viewer.overlay.setAttribute("height", String(height));
  const laidOut = layoutMarkers(sideKey, markers, width, height);
  state.markerLayout[String(sideKey)] = laidOut;
  viewer.overlay.innerHTML = "";
  for(const marker of laidOut){
    const group = document.createElementNS(SVG_NS, "g");
    const selected = Number(marker.tube_number) === state.selectedTube;
    group.setAttribute("class", `marker ${selected ? "active" : ""}`);
    group.style.cursor = "pointer";
    group.addEventListener("click", () => setSelectedTube(Number(marker.tube_number)));

    const line = document.createElementNS(SVG_NS, "line");
    line.setAttribute("class", "marker-line");
    line.setAttribute("x1", String(marker.x));
    line.setAttribute("y1", String(marker.y));
    line.setAttribute("x2", String(marker.anchorX));
    line.setAttribute("y2", String(marker.labelY));
    group.appendChild(line);

    const dot = document.createElementNS(SVG_NS, "circle");
    dot.setAttribute("class", "marker-dot");
    dot.setAttribute("cx", String(marker.x));
    dot.setAttribute("cy", String(marker.y));
    dot.setAttribute("r", "6");
    group.appendChild(dot);

    const rect = document.createElementNS(SVG_NS, "rect");
    rect.setAttribute("class", "marker-box");
    rect.setAttribute("x", String(marker.boxX));
    rect.setAttribute("y", String(marker.boxY));
    rect.setAttribute("width", String(marker.boxWidth));
    rect.setAttribute("height", String(marker.boxHeight));
    rect.setAttribute("rx", String(Math.max(7, Math.round(marker.boxHeight / 2))));
    rect.setAttribute("fill", "var(--bubble)");
    rect.setAttribute("fill-opacity", "0.82");
    group.appendChild(rect);

    const text = document.createElementNS(SVG_NS, "text");
    text.setAttribute("class", "marker-text");
    text.setAttribute("x", String(marker.boxX + marker.boxWidth / 2));
    text.setAttribute("y", String(marker.labelY));
    text.setAttribute("fill", "var(--bubble-text)");
    text.setAttribute("stroke", "var(--bubble-stroke)");
    text.textContent = String(marker.label || marker.tube_number);
    group.appendChild(text);

    const small = document.createElementNS(SVG_NS, "text");
    small.setAttribute("class", "marker-small");
    small.setAttribute("x", String(marker.x));
    small.setAttribute("y", String(marker.y - 12));
    small.textContent = `T${marker.tube_idx}`;
    group.appendChild(small);

    if(selected){
      dot.setAttribute("r", "3.6");
      rect.setAttribute("width", String(marker.boxWidth + 2));
      rect.setAttribute("height", String(marker.boxHeight + 1));
      rect.setAttribute("x", String(marker.boxX - 1));
      rect.setAttribute("y", String(marker.boxY - 0.5));
    } else {
      dot.setAttribute("r", "2.8");
    }

    viewer.overlay.appendChild(group);
  }
  applyZoom(sideKey);
  focusViewerOnMarkers(sideKey, laidOut);
}

function renderViewers(){
  renderViewer("151");
  renderViewer("152");
}

async function captureAndProcess(){
  if(!INITIAL.capture_api_url) return;
  els.captureBtn.disabled = true;
  els.historyBtn.disabled = true;
  els.refreshBtn.disabled = true;
  setActionStatus("Downloading images and processing the pair. This may take a moment...");
  try{
    const response = await fetch(INITIAL.capture_api_url, {method:"POST"});
    const payload = await response.json();
    if(!response.ok){
      throw new Error(payload.error || "Could not complete the capture.");
    }
    setActionStatus("Capture finished. Opening the processed run...");
    window.location.href = payload.run_url || payload.latest_url || "/";
  }catch(error){
    setActionStatus(error && error.message ? error.message : "Could not complete the capture.", {error:true});
  }finally{
    els.captureBtn.disabled = false;
    els.historyBtn.disabled = false;
    els.refreshBtn.disabled = false;
  }
}

function bindActions(){
  els.refreshBtn.addEventListener("click", () => window.location.reload());
  els.captureBtn.addEventListener("click", () => { void captureAndProcess(); });
  els.historyBtn.addEventListener("click", () => {
    window.location.href = INITIAL.history_url || "/history";
  });
  els.latestBtn.addEventListener("click", () => {
    window.location.href = INITIAL.latest_url || "/";
  });
  els.clearSelectionBtn.addEventListener("click", () => setSelectedTube(null));
  for(const btn of document.querySelectorAll("[data-zoom-side][data-zoom-action]")){
    btn.addEventListener("click", () => {
      const sideKey = String(btn.dataset.zoomSide || "");
      const action = String(btn.dataset.zoomAction || "");
      const current = state.zoom[sideKey] || 1;
      if(action === "in") setZoom(sideKey, current * 1.2);
      else if(action === "out") setZoom(sideKey, current / 1.2);
      else setZoom(sideKey, 1);
    });
  }
  bindViewerInteractions("151");
  bindViewerInteractions("152");
}

function boot(){
  applyEnglishCopy();
  renderHeader();
  applyEnglishHeaderState();
  renderTable();
  renderViewers();
  bindActions();
}

boot();
</script>
