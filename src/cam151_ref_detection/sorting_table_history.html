<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download History</title>
<style>
:root{
  --bg:#efe6ca;
  --panel:#fffdfa;
  --ink:#1f2228;
  --muted:#6b6d73;
  --line:#2c2f34;
  --band:#474543;
  --band-accent:#cb2f84;
  --card:#f6f1de;
  --shadow:0 20px 50px rgba(72,54,16,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at top left, rgba(255,255,255,.55), transparent 32%),
    linear-gradient(180deg, #f6edd4 0%, var(--bg) 38%, #e8debd 100%);
  color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",Tahoma,sans-serif;
}
.shell{
  max-width:1500px;
  margin:0 auto;
  padding:24px 22px 28px;
}
.topbar{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  margin-bottom:18px;
}
.eyebrow{
  margin:0 0 6px;
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#735e28;
}
.title{
  margin:0;
  font-size:30px;
  line-height:1.05;
  letter-spacing:.02em;
}
.subtitle{
  margin:8px 0 0;
  color:var(--muted);
  font-size:14px;
  line-height:1.4;
}
.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
button{
  border:1px solid #8e7b42;
  border-radius:999px;
  padding:10px 16px;
  background:#443919;
  color:#fff8e7;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 10px 20px rgba(58,46,17,.15);
}
button.secondary{
  background:#fff8e2;
  color:#47391a;
}
button[disabled]{
  opacity:.6;
  cursor:wait;
}
.status{
  min-height:18px;
  margin-bottom:16px;
  padding:0 2px;
  font-size:13px;
  color:#5c533d;
}
.status.error{
  color:#8c1f1f;
}
.panel{
  background:rgba(255,252,246,.96);
  border:1px solid rgba(78,70,55,.22);
  border-radius:26px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.panel-band{
  padding:20px 24px 18px;
  background:var(--band);
  border-bottom:3px solid var(--band-accent);
  color:#fff;
}
.panel-band h2{
  margin:0;
  font-size:24px;
  letter-spacing:.02em;
}
.filters{
  display:flex;
  align-items:flex-end;
  gap:12px;
  flex-wrap:wrap;
  padding:18px 20px 14px;
  background:var(--card);
  border-bottom:1px solid rgba(58,52,39,.12);
}
.field{
  min-width:220px;
}
.field label{
  display:block;
  margin-bottom:6px;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:#6d624b;
}
.field input{
  width:100%;
  border:1px solid rgba(58,52,39,.18);
  border-radius:12px;
  padding:10px 12px;
  font:inherit;
  background:#fffdf6;
}
.result-note{
  padding:0 20px 16px;
  font-size:13px;
  color:var(--muted);
}
.table-wrap{
  overflow:auto;
}
table{
  width:100%;
  border-collapse:collapse;
}
thead th{
  position:sticky;
  top:0;
  background:#4b4948;
  color:#fff;
  font-size:15px;
  padding:12px 10px;
  border:1px solid var(--line);
  text-align:center;
}
tbody td{
  background:#f8f8f8;
  border:1px solid var(--line);
  padding:10px 12px;
  font-size:14px;
  text-align:center;
}
tbody tr:nth-child(odd) td{
  background:#f2f2f2;
}
tbody tr.can-open{
  cursor:pointer;
}
tbody tr.can-open:hover td{
  background:#edf5fb;
}
tbody tr.latest td:first-child{
  background:#4e6f8a;
  color:#fff;
  font-weight:800;
}
.status-chip{
  display:inline-block;
  min-width:110px;
  padding:5px 10px;
  border-radius:999px;
  background:#e8e0c7;
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.status-chip.processed{background:#d6ead8;color:#214c2a}
.status-chip.capture_failed,
.status-chip.processing_failed,
.status-chip.processed_with_warning{background:#f6ddcf;color:#7b331d}
.row-actions{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}
.row-actions a,
.row-actions button{
  min-width:88px;
  padding:8px 12px;
  font-size:12px;
  text-decoration:none;
}
.row-actions a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid #8e7b42;
  border-radius:999px;
  background:#443919;
  color:#fff8e7;
}
.row-actions .secondary{
  background:#fff8e2;
  color:#47391a;
}
.row-actions a.secondary{
  background:#fff8e2;
  color:#47391a;
}
.row-actions .danger{
  background:#7a1f1f;
  color:#fff5f0;
  border:1px solid #5c1717;
}
.row-actions .danger[disabled]{
  opacity:.5;
  cursor:not-allowed;
}
.empty{
  padding:26px;
  text-align:center;
  color:var(--muted);
}
@media(max-width:900px){
  .shell{padding:18px 14px 22px}
  .topbar{flex-direction:column}
}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div>
      <p class="eyebrow">Sorting Table MVP</p>
      <h1 class="title" id="pageTitle">Download History</h1>
      <p class="subtitle">Select a processed run to open it in the MVP. The main filter is the capture date.</p>
    </div>
    <div class="actions">
      <button type="button" id="captureBtn">Download and Process</button>
      <button type="button" class="secondary" id="latestBtn">View Latest</button>
      <button type="button" class="secondary" id="reloadBtn">Reload List</button>
    </div>
  </div>

  <div class="status" id="statusLine"></div>

  <section class="panel">
    <div class="panel-band">
      <h2>Saved Runs</h2>
    </div>
    <div class="filters">
      <div class="field">
        <label for="dateFilter">Date</label>
        <input type="date" id="dateFilter">
      </div>
      <div class="field">
        <label for="textFilter">Text</label>
        <input type="search" id="textFilter" placeholder="run id, status, image...">
      </div>
      <button type="button" class="secondary" id="clearFiltersBtn">Clear Filters</button>
    </div>
    <div class="result-note" id="resultNote"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Run ID</th>
            <th>Capture Date</th>
            <th>Status</th>
            <th>Matched</th>
            <th>Left Only</th>
            <th>Right Only</th>
            <th>Detector</th>
            <th>Images</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
      <div class="empty" id="historyEmpty" hidden>No runs match the current filter.</div>
    </div>
  </section>
</div>

<script>
const INITIAL = __HISTORY_STATE__;

const els = {
  captureBtn: document.getElementById("captureBtn"),
  latestBtn: document.getElementById("latestBtn"),
  reloadBtn: document.getElementById("reloadBtn"),
  clearFiltersBtn: document.getElementById("clearFiltersBtn"),
  dateFilter: document.getElementById("dateFilter"),
  textFilter: document.getElementById("textFilter"),
  statusLine: document.getElementById("statusLine"),
  resultNote: document.getElementById("resultNote"),
  historyBody: document.getElementById("historyBody"),
  historyEmpty: document.getElementById("historyEmpty"),
};

function runs(){
  return Array.isArray(INITIAL.runs) ? INITIAL.runs : [];
}

function setStatus(message, options = {}){
  els.statusLine.textContent = String(message || "");
  els.statusLine.classList.toggle("error", Boolean(options.error));
}

function formatDateTime(value){
  if(!value) return "-";
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return String(value);
  return `${date.toLocaleDateString()} ${date.toLocaleTimeString()}`;
}

function normalizeText(value){
  return String(value || "").toLowerCase();
}

function detectorLabel(entry){
  const source = String(entry.detection_source || "").toLowerCase();
  if(source === "yolo_pipe_end") return "YOLO";
  if(source) return source;
  return "-";
}

function filterRuns(){
  const dateValue = String(els.dateFilter.value || "");
  const textValue = normalizeText(els.textFilter.value || "");
  return runs().filter((entry) => {
    if(dateValue && String(entry.captured_date || "") !== dateValue){
      return false;
    }
    if(!textValue) return true;
    const haystack = [
      entry.run_id,
      entry.status,
      entry.cam151_image_name,
      entry.cam152_image_name,
      entry.detection_source,
      entry.error,
      entry.captured_at,
    ].map(normalizeText).join(" ");
    return haystack.includes(textValue);
  });
}

function renderHistory(){
  const filtered = filterRuns();
  els.resultNote.textContent = `${filtered.length} visible run(s) out of ${runs().length} total.`;
  if(!filtered.length){
    els.historyBody.innerHTML = "";
    els.historyEmpty.hidden = false;
    return;
  }
  els.historyEmpty.hidden = true;
  els.historyBody.innerHTML = filtered.map((entry) => {
    const latestClass = entry.is_latest ? "latest" : "";
    const openClass = entry.can_open && entry.run_url ? "can-open" : "";
    const runUrl = entry.can_open && entry.run_url ? String(entry.run_url) : "";
    const errorLine = entry.error ? `<div style="margin-top:6px;color:#8c1f1f;font-size:12px">${entry.error}</div>` : "";
    const openAction = entry.can_open && entry.run_url
      ? `<a href="${escapeAttr(entry.run_url)}">Open Run</a>`
      : `<button type="button" class="secondary" disabled>No view</button>`;
    const runId = String(entry.run_id || "");
    const isCaptureRun = runId && !runId.startsWith("artifact:");
    const homographyActions = isCaptureRun
      ? `<a class="secondary" href="/homography-editor?run_id=${encodeURIComponent(runId)}&camera=151">Homog 151</a><a class="secondary" href="/homography-editor?run_id=${encodeURIComponent(runId)}&camera=152">Homog 152</a>`
      : "";
    const deleteAction = isCaptureRun && INITIAL.delete_api_url
      ? `<button type="button" class="danger" data-run-id="${escapeAttr(runId)}">Delete</button>`
      : "";
    return `
      <tr class="${latestClass} ${openClass}" data-run-id="${escapeAttr(runId)}" data-run-url="${escapeAttr(runUrl)}">
        <td>${entry.run_id || "-"}</td>
        <td>${formatDateTime(entry.captured_at)}</td>
        <td>
          <span class="status-chip ${entry.status || ""}">${entry.status || "-"}</span>
          ${errorLine}
        </td>
        <td>${Number((entry.summary || {}).matched || 0)}</td>
        <td>${Number((entry.summary || {}).left_only || 0)}</td>
        <td>${Number((entry.summary || {}).right_only || 0)}</td>
        <td>${detectorLabel(entry)}</td>
        <td>${entry.cam151_image_name || "-"}<br>${entry.cam152_image_name || "-"}</td>
        <td><div class="row-actions">${openAction}${homographyActions}${deleteAction}</div></td>
      </tr>
    `;
  }).join("");
}

function escapeAttr(value){
  return String(value || "").replace(/[&<>"']/g, (ch) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
}

async function deleteRun(runId, button){
  if(!INITIAL.delete_api_url) return;
  const confirmed = window.confirm(`Permanently delete run ${runId}? Its images and artifacts will be removed.`);
  if(!confirmed) return;
  button.disabled = true;
  setStatus(`Deleting run ${runId}...`);
  try{
    const response = await fetch(`${INITIAL.delete_api_url}/${encodeURIComponent(runId)}`, {method:"DELETE"});
    const payload = await response.json().catch(() => ({}));
    if(!response.ok || payload.ok === false){
      throw new Error(payload.error || "Could not delete the run.");
    }
    INITIAL.runs = runs().filter((entry) => String(entry.run_id || "") !== String(runId));
    if(payload.pointer_cleared){
      INITIAL.latest_run_id = null;
    }
    setStatus(`Run ${runId} deleted.`);
    renderHistory();
  }catch(error){
    button.disabled = false;
    setStatus(error && error.message ? error.message : "Could not delete the run.", {error:true});
  }
}

async function captureAndProcess(){
  if(!INITIAL.capture_api_url) return;
  els.captureBtn.disabled = true;
  els.reloadBtn.disabled = true;
  els.latestBtn.disabled = true;
  setStatus("Downloading images and processing the pair. This may take a moment...");
  try{
    const response = await fetch(INITIAL.capture_api_url, {method:"POST"});
    const payload = await response.json();
    if(!response.ok){
      throw new Error(payload.error || "Could not complete the capture.");
    }
    setStatus("Capture finished. Opening the processed run...");
    window.location.href = payload.run_url || payload.latest_url || "/";
  }catch(error){
    setStatus(error && error.message ? error.message : "Could not complete the capture.", {error:true});
  }finally{
    els.captureBtn.disabled = false;
    els.reloadBtn.disabled = false;
    els.latestBtn.disabled = false;
  }
}

function bindActions(){
  els.captureBtn.addEventListener("click", () => { void captureAndProcess(); });
  els.latestBtn.addEventListener("click", () => {
    window.location.href = INITIAL.latest_url || "/";
  });
  els.reloadBtn.addEventListener("click", () => window.location.reload());
  els.clearFiltersBtn.addEventListener("click", () => {
    els.dateFilter.value = "";
    els.textFilter.value = "";
    renderHistory();
  });
  els.dateFilter.addEventListener("input", renderHistory);
  els.textFilter.addEventListener("input", renderHistory);
  els.historyBody.addEventListener("click", (event) => {
    const button = event.target instanceof HTMLElement ? event.target.closest("button.danger[data-run-id]") : null;
    if(button){
      event.preventDefault();
      const runId = button.getAttribute("data-run-id");
      if(runId) void deleteRun(runId, button);
      return;
    }
    const link = event.target instanceof HTMLElement ? event.target.closest("a") : null;
    if(link) return;
    const row = event.target instanceof HTMLElement ? event.target.closest("tr[data-run-url]") : null;
    const runUrl = row ? row.getAttribute("data-run-url") : "";
    if(runUrl){
      window.location.href = runUrl;
    }
  });
}

function boot(){
  renderHistory();
  bindActions();
  if(runs().length){
    setStatus(`Recorded latest: ${INITIAL.latest_run_id || "none"}.`);
  } else {
    setStatus("There are no saved runs yet.");
  }
}

boot();
if(runs().length){
  setStatus(`Recorded latest: ${INITIAL.latest_run_id || "none"}.`);
} else {
  setStatus("There are no saved runs yet.");
}
</script>
</body>
</html>
